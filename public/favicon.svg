<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="#e8356d"/>

  <!-- Camera body -->
  <rect x="4" y="10" width="24" height="16" rx="3" fill="white" fill-opacity="0.15" stroke="white" stroke-width="1.4"/>

  <!-- Lens ring -->
  <circle cx="16" cy="18" r="5.5" stroke="white" stroke-width="1.6" fill="none"/>

  <!-- Lens fill -->
  <circle cx="16" cy="18" r="3" fill="white" fill-opacity="0.9"/>

  <!-- Lens center -->
  <circle cx="16" cy="18" r="1.2" fill="#e8356d"/>

  <!-- Viewfinder bump -->
  <rect x="11" y="6" width="10" height="5" rx="2" fill="white" fill-opacity="0.9"/>

  <!-- Flash dot -->
  <circle cx="25" cy="13" r="1.5" fill="white" fill-opacity="0.7"/>
</svg>
