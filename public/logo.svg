<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Background pill -->
  <rect width="48" height="48" rx="12" fill="#e8356d"/>

  <!-- Camera body outline -->
  <rect x="8" y="16" width="32" height="22" rx="4" fill="white" fill-opacity="0.15" stroke="white" stroke-width="1.6"/>

  <!-- Lens mount ring -->
  <circle cx="24" cy="27" r="8" stroke="white" stroke-width="1.8" fill="none"/>

  <!-- Lens inner -->
  <circle cx="24" cy="27" r="4.5" fill="white" fill-opacity="0.9"/>

  <!-- Lens center dot -->
  <circle cx="24" cy="27" r="1.8" fill="#e8356d"/>

  <!-- Viewfinder bump -->
  <rect x="18" y="11" width="12" height="6" rx="2.5" fill="white" fill-opacity="0.9"/>

  <!-- Flash indicator dot -->
  <circle cx="37" cy="20" r="2" fill="white" fill-opacity="0.7"/>
</svg>
